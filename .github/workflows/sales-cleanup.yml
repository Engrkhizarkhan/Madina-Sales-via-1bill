name: Sign an explicitly requested test-sales cleanup
on:
  workflow_dispatch:
    inputs:
      installation_id:
        description: Exact main-PC installation UUID
        required: true
        type: string
      release_id:
        description: Exact accepted release currently running on that PC
        required: true
        type: string
      owner_id:
        description: Protected main administrator ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Sign only the fixed sales-cleanup operation
        run: node scripts/sign-sales-cleanup.mjs "$RUNNER_TEMP/madina-clear-test-sales.json"
        env:
          MADINA_MAINTENANCE_KEY_BASE64: ${{ secrets.MADINA_RELEASE_SIGNING_KEY }}
          INPUT_INSTALLATION_ID: ${{ inputs.installation_id }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_OWNER_ID: ${{ inputs.owner_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owner-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/madina-clear-test-sales.json
          retention-days: 1
          if-no-files-found: error
